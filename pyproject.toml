[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kccs-adjudication-case-study"
version = "0.2.0"
description = "Tenant-scoped evidence eligibility and temporal replay prototype"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Zulfiqar Ali Ahmed"}]
dependencies = ["openpyxl==3.1.5", "defusedxml==0.7.1"]

[project.scripts]
adjudication = "adjudication.cli:main"

[tool.setuptools.packages.find]
where = ["prototype/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["adjudication"]
