name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install bandit pip-audit ./prototype
      - run: bandit -r prototype/src -ll
      - run: pip-audit --desc
      - name: Full-history credential scan
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-max-time 120 --connect-timeout 15 --max-time 60 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact .
