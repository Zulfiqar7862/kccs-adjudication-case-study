name: Security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dependency-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: bandit -r prototype/src -ll
      - name: Full-history secret scan
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
