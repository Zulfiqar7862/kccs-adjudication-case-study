name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package as a user would
        run: python -m pip install ./prototype
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests and actual HTTP lifecycle on fictional data
        run: python scripts/check.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff>=0.15,<1'
      - run: ruff check --config prototype/pyproject.toml prototype/src prototype/tests scripts
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the isolated fictional demo
        run: docker compose run --build --rm prototype
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run the Windows launcher
        shell: pwsh
        run: ./prototype/run.ps1 demo
      - name: Root runner, newcomer path (check, then explain on the anonymized workbook)
        shell: pwsh
        run: |
          ./run.ps1
          ./run.ps1 pack data/anonymized-evaluation.xlsx
          ./run.ps1 explain REF-00009
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Root runner, newcomer path (check, then explain on the anonymized workbook)
        run: |
          ./run.sh
          ./run.sh pack data/anonymized-evaluation.xlsx
          ./run.sh explain REF-00009
          ./run.sh explain REF-00009 --known-at 2019-01-01T00:00:00+00:00
