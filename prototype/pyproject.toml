[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-adjudication"
version = "0.2.0"
description = "Local evidence-first adjudication workflow with durable cases and independent clocks"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["defusedxml==0.7.1"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
